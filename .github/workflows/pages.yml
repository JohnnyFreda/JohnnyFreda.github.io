name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The Tourify design docs are markdown in git; the HTML is generated here
      # so the committed source stays the single place they are edited.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tourify/requirements.txt
      - run: python3 tourify/build.py
      - run: python3 resume/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
